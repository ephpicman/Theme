name: Sync EPM

on:
  schedule:
    # 09:00 Asia/Tehran (UTC+03:30). GitHub scheduled workflows use UTC.
    - cron: "30 5 * * *"
  workflow_dispatch:
  # Bootstrap epm/ after the workflow is installed; later sync commits do not touch this file.
  push:
    paths:
      - ".github/workflows/sync-epm.yml"

permissions:
  contents: write

concurrency:
  group: sync-epm-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync EPM main into epm/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Add or update EPM subtree
        shell: bash
        run: |
          set -euo pipefail
          EPM_REPOSITORY="https://github.com/ephpicman/EPM.git"
          if [ -d "epm" ]; then
            git subtree pull --prefix=epm "$EPM_REPOSITORY" main --squash
          else
            git subtree add --prefix=epm "$EPM_REPOSITORY" main --squash
          fi
      - name: Push sync commit to main
        run: git push origin HEAD:main
